<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Jobs</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        JobPortal
    </div>

    <div>

        <a href="/">Home</a>

        <a href="/jobs">Jobs</a>

        <a href="/profile">My Profile</a>

        <a href="/add-job">Post Job</a>

        <form th:action="@{/logout}"
              method="post"
              style="display:inline;">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit" class="logout-btn">
                Logout
            </button>
        </form>

    </div>

</nav>

<div class="container">

    <h1>Available Jobs</h1>

    <form action="/search"
          method="get"
          class="search-box">

        <input type="text"
               name="keyword"
               placeholder="Search by job title">

        <button type="submit" class="btn">
            Search
        </button>

    </form>

    <div class="job-grid">

        <div class="job-card"
             th:each="job : ${jobs}">

            <h2 th:text="${job.title}">
                Java Developer
            </h2>

            <p>
                🏢
                <b>Company:</b>
                <span th:text="${job.company}"></span>
            </p>

            <p>
                📍
                <b>Location:</b>
                <span th:text="${job.location}"></span>
            </p>

            <p>
                💰
                <b>Salary:</b>
                <span th:text="${job.salary}"></span>
            </p>

            <p>
                🛠
                <b>Skills:</b>
                <span th:text="${job.skills}"></span>
            </p>

            <p th:text="${job.description}"></p>

            <a class="btn"
               th:href="@{/apply/{id}(id=${job.id})}">
                Apply Now
            </a>

            <a class="delete"
               th:href="@{/delete-job/{id}(id=${job.id})}">
                Delete
            </a>

        </div>

    </div>

</div>

</body>
</html>
