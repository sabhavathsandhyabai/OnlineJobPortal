<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Post a New Job - Recruiter</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #333;
        }

        .page-container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .page-header {
            background: white;
            padding: 25px 30px;
            border-radius: 18px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .page-header h1 {
            margin: 0;
            color: #2457c5;
            font-size: 32px;
        }

        .page-header p {
            margin-top: 8px;
            color: #666;
        }

        .job-card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .job-card h2 {
            margin-top: 0;
            color: #2457c5;
            font-size: 28px;
            margin-bottom: 25px;
        }

        .job-card h2 span {
            color: #7a42c8;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #2864dc;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .description {
            margin-bottom: 20px;
        }

        .button-area {
            margin-top: 25px;
        }

        .post-button {
            border: none;
            background: #2864dc;
            color: white;
            padding: 14px 30px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .post-button:hover {
            background: #174db7;
        }

        .cancel-button {
            display: inline-block;
            margin-left: 12px;
            padding: 13px 25px;
            border-radius: 8px;
            background: #eeeeee;
            color: #444;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #2864dc;
            text-decoration: none;
            font-weight: bold;
        }

        .success-message {
            background: #e8f8ee;
            color: #16803c;
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 700px) {
            .page-container {
                width: 94%;
                margin: 20px auto;
            }

            .job-card {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .page-header h1 {
                font-size: 25px;
            }

            .job-card h2 {
                font-size: 23px;
            }

            .cancel-button {
                margin-left: 0;
                margin-top: 10px;
            }
        }
    </style>
</head>

<body>

<div class="page-container">

    <div class="page-header">

        <h1>Recruiter Dashboard</h1>

        <p>
            Create and manage job opportunities for candidates.
        </p>

    </div>


    <div class="job-card">

        <h2>
            <span>＋</span> Post a New Job
        </h2>


        <p class="success-message"
           th:if="${param.success}">
            Job posted successfully!
        </p>


        <form th:action="@{/add-job}"
              th:object="${job}"
              method="post">

            <!-- CSRF -->

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">


            <!-- Job Title + Company -->

            <div class="form-row">

                <div class="form-group">

                    <label>Job Title</label>

                    <input type="text"
                           th:field="*{title}"
                           placeholder="Example: Java Developer"
                           required>

                </div>


                <div class="form-group">

                    <label>Company Name</label>

                    <input type="text"
                           th:field="*{company}"
                           placeholder="Example: TCS"
                           required>

                </div>

            </div>


            <!-- Location + Salary -->

            <div class="form-row">

                <div class="form-group">

                    <label>Location</label>

                    <input type="text"
                           th:field="*{location}"
                           placeholder="Example: Bangalore"
                           required>

                </div>


                <div class="form-group">

                    <label>Salary</label>

                    <input type="text"
                           th:field="*{salary}"
                           placeholder="Example: 4 LPA"
                           required>

                </div>

            </div>


            <!-- Skills + Job Type -->

            <div class="form-row">

                <div class="form-group">

                    <label>Required Skills</label>

                    <input type="text"
                           th:field="*{skills}"
                           placeholder="Example: Java, Spring Boot, MySQL"
                           required>

                </div>


                <div class="form-group">

                    <label>Job Type</label>

                    <select th:field="*{jobType}" required>

                        <option value="">
                            Select Job Type
                        </option>

                        <option value="Full Time">
                            Full Time
                        </option>

                        <option value="Part Time">
                            Part Time
                        </option>

                        <option value="Internship">
                            Internship
                        </option>

                        <option value="Contract">
                            Contract
                        </option>

                        <option value="Work From Home">
                            Work From Home
                        </option>

                    </select>

                </div>

            </div>


            <!-- Description -->

            <div class="form-group description">

                <label>Job Description</label>

                <textarea th:field="*{description}"
                          placeholder="Enter the job responsibilities, requirements, qualifications and other details..."
                          required></textarea>

            </div>


            <!-- Buttons -->

            <div class="button-area">

                <button type="submit"
                        class="post-button">
                    Post Job
                </button>

                <a href="/recruiter-dashboard"
                   class="cancel-button">
                    Cancel
                </a>

            </div>

        </form>


        <a href="/recruiter-dashboard"
           class="back-link">
            ← Back to Recruiter Dashboard
        </a>

    </div>

</div>

</body>
</html>
