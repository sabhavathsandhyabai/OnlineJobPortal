<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>My Applications</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        JobPortal
    </div>

    <div>

        <a href="/">Home</a>

        <a href="/jobs">Jobs</a>

        <a href="/profile">My Profile</a>

        <form th:action="@{/logout}"
              method="post"
              style="display:inline;">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit">
                Logout
            </button>

        </form>

    </div>

</nav>

<div class="container">

    <h1>My Applications</h1>

    <table>

        <thead>

        <tr>
            <th>Job</th>
            <th>Applicant</th>
            <th>Email</th>
            <th>Status</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="app: ${applications}">

            <td th:text="${app.jobTitle}">
                Java Developer
            </td>

            <td th:text="${app.applicantName}">
                User
            </td>

            <td th:text="${app.applicantEmail}">
                user@gmail.com
            </td>

            <td th:text="${app.status}">
                Applied
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
